services:
  - type: web
    name: xadrez-multiplayer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: ALLOWED_ORIGINS
        value: https://andrelogin.github.io,http://localhost:4173,http://127.0.0.1:4173
      - key: DATABASE_URL
        sync: false
